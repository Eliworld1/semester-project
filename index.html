<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWatch - Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <h1>SpendWatch</h1>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="history.html">History</a></li>
            </ul>
        </nav>
    </header>

    <section class="expense-checker">
    <h2>Check Your Expense</h2>
    <p>Enter an amount to add what you spent.</p>

    <label for="expenseAmount">Expense Amount ($):</label>
    <input
        type="number"
        id="expenseAmount"
        min="0.01"
        step="0.01"
        placeholder="Enter amount"
    >

    <button type="button" id="checkExpense">Check Expense</button>

    <p id="feedback" role="status" aria-live="polite"></p>
</section>


        
        </section>

        <section class="summary">
            <h2>Spending Summary</h2>

            <div class="cards">

                <article class="card">
                    <h3>Total Spent</h3>
                    <p>$0.00</p>
                </article>

                <article class="card">
                    <h3>This Month</h3>
                    <p>$0.00</p>
                </article>

                <article class="card">
                    <h3>Expenses</h3>
                    <p>0</p>
                </article>

            </div>
        </section>

       <section class="history">
    <h2>Recent Expenses</h2>

    <p class="no-expenses">
        No expenses at the moment!
    </p>
</section>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 SpendWatch Expense Tracker</p>
    </footer>
 <script src="script.js"></script>
</body>
</html>
